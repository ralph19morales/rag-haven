# Streamlit configuration for the RAG web UI.

[server]
# The default "watchdog" file-watcher walks every imported module's path to
# enable hot-reload. With torch/transformers installed, that walk triggers a
# lazy import of optional image models (zoedepth) that need torchvision — a
# library this app doesn't use — producing a noisy ModuleNotFoundError.
# We don't need hot-reload for running the app, so turn the watcher off.
fileWatcherType = "none"

[browser]
gatherUsageStats = false

# ---------------------------------------------------------------------------
# Theme — Haven, heads-up display.
#
# Haven commits to a single dark identity rather than following the reader's
# light/dark preference, which is why the values below are repeated verbatim
# into [theme.light] and [theme.dark]: Streamlit picks a sub-table from the
# browser's preference, and mirroring them is what makes that choice a no-op.
# `ui/chrome.py` therefore does not branch on theme at all.
#
# This IS the ops dashboard's palette now — the values mirror `ui/hud.py`, and
# `ui/chrome.py` is built on `hud_css()` rather than beside it. The two surfaces
# were once deliberately unlike each other; that split was removed by request.
# This table exists so Streamlit's OWN widget chrome (buttons, alerts, the chat
# input, code blocks) lands on the console ground instead of fighting the CSS
# layered over it — a stock-themed widget inside a HUD reads as a half-finished
# theme rather than a deliberate one.
#
# What the console palette does NOT cover, and `ui/chrome.py` handles instead:
# the not-legal-advice panel is drawn in the ALERT hue, not the accent. Cyan is
# the colour of everything on this page that is merely working, and the eye
# stops reading it within seconds.
#
# Contrast against the #0a1119 ground, measured: text 14.1:1, dim 6.0:1, accent
# 11.4:1, alert 6.4:1, and dark ink on a cyan button 11.4:1. Every one clears AA
# for body text, not merely the 3:1 UI floor. `borderColor` is a hairline and is
# exempt — it only has to suggest an edge.
#
# FONTS ARE THE BUILT-IN KEYWORDS ON PURPOSE. Streamlit can pull a face from
# Google Fonts, but this app's whole premise is that nothing leaves the machine
# at query time — a webfont request would break that, and fail offline besides.
# ---------------------------------------------------------------------------
[theme]
font = "monospace"
headingFont = "monospace"
codeFont = "monospace"
baseFontSize = 16
headingFontSizes = ["30px", "22px", "18px", "16px", "14px", "13px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
codeFontSize = "0.84rem"
# Square corners: a console has no rounded panels, and every hand-drawn surface
# in ui/hud.py and ui/chrome.py sets border-radius: 0.
baseRadius = "none"
buttonRadius = "none"
showWidgetBorder = true
showSidebarBorder = false
linkUnderline = false
# The two categorical slots from ui/hud.py first, then muted neighbours. Status
# hues (amber, red, green) are deliberately absent: a series drawn in one reads
# as a warning rather than as a measure.
chartCategoricalColors = ["#3fc0e6", "#8f78e0", "#5f9fbf", "#a88fd6", "#7fb8cc", "#6f97a8", "#4a7f96"]

# --- the palette, stated once ----------------------------------------------
[theme.light]
primaryColor = "#4fd8ff"            # cyan — the single accent
backgroundColor = "#0a1119"
secondaryBackgroundColor = "#0e1822"
textColor = "#bfe4f2"
linkColor = "#4fd8ff"
borderColor = "#16394a"
codeBackgroundColor = "#0e1822"
codeTextColor = "#bfe4f2"
dataframeBorderColor = "#16394a"
dataframeHeaderBackgroundColor = "#0e1822"
greenColor = "#35e0a1"
redColor = "#ff5f6d"
orangeColor = "#ffb648"
yellowColor = "#ffd166"
blueColor = "#3fc0e6"
violetColor = "#8f78e0"
grayColor = "#6f97a8"

[theme.light.sidebar]
backgroundColor = "#070d13"
secondaryBackgroundColor = "#0e1822"
codeBackgroundColor = "#0e1822"
textColor = "#bfe4f2"
borderColor = "#16394a"
primaryColor = "#4fd8ff"

[theme.dark]
primaryColor = "#4fd8ff"
backgroundColor = "#0a1119"
secondaryBackgroundColor = "#0e1822"
textColor = "#bfe4f2"
linkColor = "#4fd8ff"
borderColor = "#16394a"
codeBackgroundColor = "#0e1822"
codeTextColor = "#bfe4f2"
dataframeBorderColor = "#16394a"
dataframeHeaderBackgroundColor = "#0e1822"
greenColor = "#35e0a1"
redColor = "#ff5f6d"
orangeColor = "#ffb648"
yellowColor = "#ffd166"
blueColor = "#3fc0e6"
violetColor = "#8f78e0"
grayColor = "#6f97a8"

[theme.dark.sidebar]
backgroundColor = "#070d13"
secondaryBackgroundColor = "#0e1822"
